<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login — Username</title>
    <style>
        :root {
            --bg-primary: #f8f9fa;
            --bg-secondary: white;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --border-color: #dee2e6;
            --button-bg: #007bff;
            --button-hover: #0056b3;
            --error-color: #dc3545;
            --shadow: rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --text-primary: #eaeaea;
            --text-secondary: #a8a8a8;
            --border-color: #2a2a3e;
            --button-bg: #0f4c75;
            --button-hover: #1b6ca8;
            --error-color: #ff6b6b;
            --shadow: rgba(0,0,0,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s ease;
        }

        .container {
            position: relative;
            width: 400px;
            padding: 20px;
        }

        .theme-toggle {
            position: absolute;
            top: -50px;
            right: 0;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            width: 60px;
            height: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px var(--shadow);
        }

        .theme-toggle::before {
            content: '☀️';
            position: absolute;
            top: 2px;
            left: 4px;
            width: 22px;
            height: 22px;
            background: var(--button-bg);
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        [data-theme="dark"] .theme-toggle::before {
            content: '🌙';
            transform: translateX(30px);
        }

        .box {
            background: var(--bg-secondary);
            padding: 2.5em;
            border-radius: 20px;
            box-shadow: 0 10px 40px var(--shadow);
            animation: slideIn 0.5s ease-out;
            transition: all 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5em;
            color: var(--text-primary);
            font-size: 1.8em;
        }

        .error {
            background: var(--error-color);
            color: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 1.5em;
            font-size: 0.9em;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .input-group {
            margin-bottom: 1.2em;
            animation: slideIn 0.6s ease-out;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--button-bg);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--shadow);
        }

        input::placeholder {
            color: var(--text-secondary);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--button-bg), var(--button-hover));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.05em;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 1em;
            animation: slideIn 0.7s ease-out;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--shadow);
        }

        button:active {
            transform: translateY(0);
        }

        .signup-link {
            text-align: center;
            margin-top: 1.5em;
            padding-top: 1.5em;
            border-top: 1px solid var(--border-color);
            animation: slideIn 0.8s ease-out;
        }

        .signup-link p {
            color: var(--text-secondary);
            font-size: 0.95em;
        }

        .signup-link a {
            color: var(--button-bg);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .signup-link a:hover {
            color: var(--button-hover);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="theme-toggle" onclick="toggleTheme()"></div>
        
        <div class="box">
            <h2>Login</h2>
            
            {% if error_text %}
            <div class="error">{{ error_text }} <small>#{{ error_code }}</small></div>
            {% endif %}
            
            <form method="post" action="/login">
                <input type="hidden" name="session" value="{{ request.args.get('session', '') }}">
                <input type="hidden" name="step" value="{{ request.args.get('step', '') }}">
                <input type="hidden" name="auth_type" value="{{ request.args.get('auth_type', '') }}">
                
                <div class="input-group">
                    <input type="text" name="username" placeholder="Username" required>
                </div>
                
                <div class="input-group">
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                
                <button type="submit">Sign In</button>
            </form>

            <div class="signup-link">
                <p>Don't have an account? <a href="/register">Sign up</a></p>
            </div>

        </div>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
