<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register — Username</title>
  <style>
    :root {
        --bg-primary: #f8f9fa;
        --bg-secondary: white;
        --text-primary: #212529;
        --text-secondary: #6c757d;
        --border-color: #dee2e6;
        --button-bg: #007bff;
        --button-hover: #0056b3;
        --error-color: #dc3545;
        --shadow: rgba(0,0,0,0.1);
    }

    [data-theme="dark"] {
        --bg-primary: #1a1a2e;
        --bg-secondary: #16213e;
        --text-primary: #eaeaea;
        --text-secondary: #a8a8a8;
        --border-color: #2a2a3e;
        --button-bg: #0f4c75;
        --button-hover: #1b6ca8;
        --error-color: #ff6b6b;
        --shadow: rgba(0,0,0,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        transition: background 0.3s ease;
        padding: 20px;
    }

    .container {
        position: relative;
        width: 100%;
        max-width: 450px;
        padding: 20px;
    }

    .theme-toggle {
        position: absolute;
        top: -50px;
        right: 0;
        background: var(--bg-secondary);
        border: 2px solid var(--border-color);
        border-radius: 50px;
        width: 60px;
        height: 30px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 2px 10px var(--shadow);
    }

    .theme-toggle::before {
        content: '☀️';
        position: absolute;
        top: 2px;
        left: 4px;
        width: 22px;
        height: 22px;
        background: var(--button-bg);
        border-radius: 50%;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
    }

    [data-theme="dark"] .theme-toggle::before {
        content: '🌙';
        transform: translateX(30px);
    }

    .box {
        background: var(--bg-secondary);
        padding: 2.5em;
        border-radius: 20px;
        box-shadow: 0 10px 40px var(--shadow);
        animation: slideIn 0.5s ease-out;
        transition: all 0.3s ease;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    h2 {
        text-align: center;
        margin-bottom: 1.5em;
        color: var(--text-primary);
        font-size: 1.8em;
    }

    .error {
        background: var(--error-color);
        color: white;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 1.5em;
        font-size: 0.9em;
        animation: shake 0.5s ease;
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
    }

    .input-group {
        margin-bottom: 1.2em;
        animation: slideIn 0.6s ease-out;
    }

    input, select {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 2px solid var(--border-color);
        background: var(--bg-primary);
        color: var(--text-primary);
        font-size: 1em;
        transition: all 0.3s ease;
    }

    input:focus, select:focus {
        outline: none;
        border-color: var(--button-bg);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px var(--shadow);
    }

    input::placeholder {
        color: var(--text-secondary);
    }

    .phone-group {
        display: flex;
        gap: 10px;
        position: relative;
    }

    .phone-select-wrapper {
        position: relative;
        flex: 1;
    }

    #phoneInput {
        flex: 1;
    }

    .custom-select {
        position: relative;
        cursor: pointer;
    }

    .select-trigger {
        padding: 14px 16px;
        border-radius: 12px;
        border: 2px solid var(--border-color);
        background: var(--bg-primary);
        color: var(--text-primary);
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.3s ease;
        user-select: none;
    }

    .select-trigger:hover {
        border-color: var(--button-bg);
    }

    .select-trigger.active {
        border-color: var(--button-bg);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px var(--shadow);
    }

    .dropdown {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        margin-top: 8px;
        background: var(--bg-secondary);
        border: 2px solid var(--border-color);
        border-radius: 12px;
        max-height: 300px;
        overflow-y: auto;
        z-index: 1000;
        display: none;
        box-shadow: 0 10px 30px var(--shadow);
        animation: dropdownSlide 0.3s ease-out;
    }

    @keyframes dropdownSlide {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .dropdown.active {
        display: block;
    }

    .dropdown-search {
        position: sticky;
        top: 0;
        padding: 12px;
        background: var(--bg-secondary);
        border-bottom: 2px solid var(--border-color);
    }

    .dropdown-search input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 2px solid var(--border-color);
        background: var(--bg-primary);
        color: var(--text-primary);
        font-size: 0.9em;
    }

    .dropdown-search input:focus {
        transform: none;
        box-shadow: none;
    }

    .dropdown-option {
        padding: 12px 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        border-bottom: 1px solid var(--border-color);
    }

    .dropdown-option:last-child {
        border-bottom: none;
    }

    .dropdown-option:hover {
        background: var(--bg-primary);
    }

    .dropdown-option.selected {
        background: var(--button-bg);
        color: white;
    }

    .dropdown-option.hidden {
        display: none;
    }

    button {
        width: 100%;
        background: linear-gradient(135deg, var(--button-bg), var(--button-hover));
        color: white;
        border: none;
        padding: 14px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 1.05em;
        font-weight: 600;
        transition: all 0.3s ease;
        margin-top: 1em;
        animation: slideIn 0.7s ease-out;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px var(--shadow);
    }

    button:active {
        transform: translateY(0);
    }

    .arrow {
        transition: transform 0.3s ease;
    }

    .arrow.rotate {
        transform: rotate(180deg);
    }

    .signin-link {
        text-align: center;
        margin-top: 1.5em;
        padding-top: 1.5em;
        border-top: 1px solid var(--border-color);
        animation: slideIn 0.8s ease-out;
    }

    .signin-link p {
        color: var(--text-secondary);
        font-size: 0.95em;
    }

    .signin-link a {
        color: var(--button-bg);
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .signin-link a:hover {
        color: var(--button-hover);
        text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="theme-toggle" onclick="toggleTheme()"></div>
    
    <div class="box">
      <h2>Register</h2>
      
      {% if error_text %}
        <div class="error">{{ error_text }} <small>#{{ error_code }}</small></div>
      {% endif %}
      
      <form method="post" action="/register" onsubmit="return prepareSubmit()">
        <input type="hidden" name="session" value="{{ request.args.get('session', '') }}">
        <input type="hidden" name="step" value="{{ request.args.get('step', '') }}">
        <input type="hidden" name="auth_type" value="{{ request.args.get('auth_type', '') }}">
        
        <div class="input-group">
          <input type="text" name="username" placeholder="Username" required>
        </div>
        
        <div class="input-group">
          <input type="password" name="password" placeholder="Password" required>
        </div>
        
        <div class="input-group">
          <input type="email" name="email" placeholder="Email" required>
        </div>

        <div class="input-group phone-group">
          <div class="phone-select-wrapper">
            <div class="custom-select">
              <div class="select-trigger" onclick="toggleDropdown()">
                <span id="selectedCountry">+1</span>
                <span class="arrow">▼</span>
              </div>
              <div class="dropdown" id="dropdown">
                <div class="dropdown-search">
                  <input type="text" id="searchInput" placeholder="Search country..." onkeyup="filterCountries()" onclick="event.stopPropagation()">
                </div>
                <div id="optionsList"></div>
              </div>
            </div>
          </div>
          <input type="tel" id="phoneInput" placeholder="Phone number" required>
        </div>
        
        <input type="hidden" name="phone" id="fullPhoneNumber">

        <button type="submit">Sign Up</button>
      </form>

      <div class="signin-link">
        <p>Have an account? <a href="/login">Sign In</a></p>
    </div>
    </div>
  </div>

    ];

    let selectedCode = "1";
    let sortedCountries = [...countries].sort((a, b) => a.name.localeCompare(b.name));

    function renderOptions() {
      const optionsList = document.getElementById('optionsList');
      optionsList.innerHTML = '';
      
      sortedCountries.forEach(country => {
        const option = document.createElement('div');
        option.className = 'dropdown-option';
        option.textContent = `${country.name} (+${country.code})`;
        option.dataset.code = country.code;
        option.dataset.name = country.name;
        
        if (country.code === selectedCode) {
          option.classList.add('selected');
        }
        
        option.onclick = () => selectCountry(country.code);
        optionsList.appendChild(option);
      });
    }

    function toggleDropdown() {
      const dropdown = document.getElementById('dropdown');
      const trigger = document.querySelector('.select-trigger');
      const arrow = document.querySelector('.arrow');
      
      dropdown.classList.toggle('active');
      trigger.classList.toggle('active');
      arrow.classList.toggle('rotate');
      
      if (dropdown.classList.contains('active')) {
        document.getElementById('searchInput').value = '';
        filterCountries();
        document.getElementById('searchInput').focus();
      }
    }

    function selectCountry(code) {
      selectedCode = code;
      document.getElementById('selectedCountry').textContent = `+${code}`;
      toggleDropdown();
      
      const options = document.querySelectorAll('.dropdown-option');
      options.forEach(opt => {
        opt.classList.remove('selected');
        if (opt.dataset.code === code) {
          opt.classList.add('selected');
        }
      });
    }

    function filterCountries() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const options = document.querySelectorAll('.dropdown-option');
      
      options.forEach(option => {
        const name = option.dataset.name.toLowerCase();
        const code = option.dataset.code;
        
        if (name.includes(searchTerm) || code.includes(searchTerm)) {
          option.classList.remove('hidden');
        } else {
          option.classList.add('hidden');
        }
      });
    }

    function prepareSubmit() {
      const phoneNumber = document.getElementById('phoneInput').value;
      const numDigits = phoneNumber.replace(/\D/g, '');
      const combined = selectedCode + numDigits;
      document.getElementById('fullPhoneNumber').value = combined;
      return true;
    }

    function toggleTheme() {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function(event) {
      const customSelect = document.querySelector('.custom-select');
      if (!customSelect.contains(event.target)) {
        const dropdown = document.getElementById('dropdown');
        const trigger = document.querySelector('.select-trigger');
        const arrow = document.querySelector('.arrow');
        if (dropdown.classList.contains('active')) {
          dropdown.classList.remove('active');
          trigger.classList.remove('active');
          arrow.classList.remove('rotate');
        }
      }
    });

    // Initialize
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    renderOptions();
  </script>
